services:
  calepin:
    image: ghcr.io/edbourque0/calepin:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Local backups (also copied to S3 when configured)
      - calepin-data:/app/data
    environment:
      # Time zone used for the daily backup time
      TZ: ${TZ:-America/Toronto}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgres://calepin:${POSTGRES_PASSWORD:-calepin}@db:5432/calepin
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      # Encrypt backups (strongly recommended when they leave the server)
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Optional off-site copy to any S3-compatible storage (Wasabi, MinIO, R2, AWS…)
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-calepin/}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: calepin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calepin}
      POSTGRES_DB: calepin
    volumes:
      - calepin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calepin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  calepin-db:
  calepin-data:
